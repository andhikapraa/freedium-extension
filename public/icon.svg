<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- Open book / wings shape representing freed reading -->
  <g transform="translate(64,62)" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left page -->
    <path d="M-4,-24 C-4,-24 -36,-28 -38,-8 C-40,12 -10,28 -4,30" fill="rgba(255,255,255,0.15)" stroke="white"/>
    <!-- Right page -->
    <path d="M4,-24 C4,-24 36,-28 38,-8 C40,12 10,28 4,30" fill="rgba(255,255,255,0.15)" stroke="white"/>
    <!-- Spine -->
    <line x1="0" y1="-26" x2="0" y2="32"/>
    <!-- Left text lines -->
    <line x1="-24" y1="-10" x2="-12" y2="-8" stroke-width="3" opacity="0.6"/>
    <line x1="-26" y1="0" x2="-12" y2="2" stroke-width="3" opacity="0.6"/>
    <line x1="-24" y1="10" x2="-10" y2="12" stroke-width="3" opacity="0.6"/>
    <!-- Right text lines -->
    <line x1="24" y1="-10" x2="12" y2="-8" stroke-width="3" opacity="0.6"/>
    <line x1="26" y1="0" x2="12" y2="2" stroke-width="3" opacity="0.6"/>
    <line x1="24" y1="10" x2="10" y2="12" stroke-width="3" opacity="0.6"/>
  </g>
  <!-- Small unlock icon top-right -->
  <g transform="translate(96,28)" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-10" y="-2" width="20" height="14" rx="3" fill="rgba(255,255,255,0.25)"/>
    <path d="M-5,-2 L-5,-7 C-5,-12 5,-12 5,-9" fill="none"/>
    <circle cx="0" cy="5" r="2" fill="white"/>
  </g>
</svg>
